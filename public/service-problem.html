<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Problem – RoadWatch UK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=GDS+Transport:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{font-family:"GDS Transport",Arial,sans-serif;margin:0;color:#0b0c0c}
  header,footer{background:#0b0c0c;color:#fff;padding:20px}
  main{max-width:900px;margin:0 auto;padding:30px}
  a{color:#1d70b8}
  textarea,input{width:100%;padding:12px;font-size:16px;margin:8px 0 16px;border:2px solid #0b0c0c}
  button{background:#00703c;color:#fff;border:none;padding:12px 24px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header><strong>RoadWatch UK</strong> — Report a problem with this service</header>
<main>
  <h1>Report a problem with this service</h1>
  <p>Use this form to tell us about technical issues such as broken links, form errors, or pages not loading correctly.</p>
  <form onsubmit="event.preventDefault(); alert('Your service issue has been recorded.'); this.reset();">
    <label for="issue">What went wrong?</label>
    <input id="issue" type="text" required placeholder="Example: Help page did not load">
    <label for="details">More details</label>
    <textarea id="details" rows="8" required placeholder="Describe the problem"></textarea>
    <button type="submit">Submit</button>
  </form>
  <p style="margin-top:20px;"><a href="index.html">Back to report form</a></p>
</main>
<footer>RoadWatch UK</footer>
</body>
</html>
