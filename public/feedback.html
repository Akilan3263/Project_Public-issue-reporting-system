<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback – RoadWatch UK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=GDS+Transport:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{font-family:"GDS Transport",Arial,sans-serif;margin:0;color:#0b0c0c}
  header,footer{background:#0b0c0c;color:#fff;padding:20px}
  main{max-width:900px;margin:0 auto;padding:30px}
  a{color:#1d70b8}
  textarea,input{width:100%;padding:12px;font-size:16px;margin:8px 0 16px;border:2px solid #0b0c0c}
  button{background:#00703c;color:#fff;border:none;padding:12px 24px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<header><strong>RoadWatch UK</strong> — Feedback</header>
<main>
  <h1>Give feedback</h1>
  <p>Tell us what worked well and what could be improved.</p>
  <form onsubmit="event.preventDefault(); alert('Thank you for your feedback.'); this.reset();">
    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Optional">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Optional">
    <label for="message">Your feedback</label>
    <textarea id="message" rows="8" required placeholder="Tell us about your experience"></textarea>
    <button type="submit">Send feedback</button>
  </form>
  <p style="margin-top:20px;"><a href="index.html">Back to report form</a></p>
</main>
<footer>RoadWatch UK</footer>
</body>
</html>
